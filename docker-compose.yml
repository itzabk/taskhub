version: '3.8'
services:
  mongo-master:
    image: mongo:7.0-jammy
    container_name: taskhub-mongo-master
    ports:
      - '27017:27017'
    volumes:
      - mongo-master-data:/data/db
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    networks: [taskhub-network]
    healthcheck:
      test: mongosh --quiet --host localhost:27017 --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo-replica-1:
    image: mongo:7.0-jammy
    container_name: taskhub-mongo-replica-1
    ports:
      - '27018:27017'
    volumes:
      - mongo-replica-1-data:/data/db
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    networks: [taskhub-network]
    depends_on:
      mongo-master:
        condition: service_healthy
    healthcheck:
      test: mongosh --quiet --host localhost:27017 --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo-replica-2:
    image: mongo:7.0-jammy
    container_name: taskhub-mongo-replica-2
    ports:
      - '27019:27017'
    volumes:
      - mongo-replica-2-data:/data/db
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    networks: [taskhub-network]
    depends_on:
      mongo-master:
        condition: service_healthy
    healthcheck:
      test: mongosh --quiet --host localhost:27017 --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo-init:
    image: mongo:7.0-jammy
    container_name: taskhub-mongo-init
    networks: [taskhub-network]
    depends_on:
      mongo-master:
        condition: service_healthy
      mongo-replica-1:
        condition: service_healthy
      mongo-replica-2:
        condition: service_healthy
    entrypoint: >
      bash -c '
      mongosh --host mongo-master:27017 --eval "
        try {
          rs.status();
          print(\"Replica set already initialized\");
        } catch (e) {
          rs.initiate({
            _id: \"rs0\",
            members: [
              { _id: 0, host: \"mongo-master:27017\", priority: 10 },
              { _id: 1, host: \"mongo-replica-1:27017\", priority: 5 },
              { _id: 2, host: \"mongo-replica-2:27017\", priority: 5 }
            ]
          });
        }
      "
      '
    restart: 'no'

  redis:
    image: redis:7.4-alpine
    container_name: taskhub-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command:
      ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-redispassword}']
    networks: [taskhub-network]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:-redispassword} ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  mailcatcher:
    image: sj26/mailcatcher:latest
    container_name: taskhub-mailcatcher
    ports:
      - '1025:1025'
      - '1080:1080'
    networks: [taskhub-network]

  otel-taskhub-logs:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: taskhub-otel-taskhub-logs
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./otel-taskhub-logs-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./logs:/logs:ro
    networks:
      - taskhub-network
    restart: unless-stopped

  taskhub-app-1: &taskhub-app
    build: .
    container_name: taskhub-app-1
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_NODE: app1
      DEPLOYMENT_ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      DB_URL: mongodb://mongo-master:27017,mongo-replica-1:27017,mongo-replica-2:27017/taskhub?replicaSet=rs0
      DB_USERNAME: ''
      DB_PASSWORD: ''

      REDIS_URL: redis://default:${REDIS_PASSWORD:-redispassword}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}

      EXPRESS_WORKERS: ${EXPRESS_WORKERS:-2}

      OTEL_SERVICE_NAME: taskhub-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://host.docker.internal:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://host.docker.internal:4318/v1/metrics
      OTEL_RESOURCE_ATTRIBUTES: service.name=taskhub-api,service.version=1.0.0,deployment.environment.name=development
    volumes:
      - ./src:/usr/src/app/src
      - ./logs:/usr/src/app/logs
    networks: [taskhub-network]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  taskhub-app-2:
    <<: *taskhub-app
    container_name: taskhub-app-2
    environment:
      NODE_ENV: production
      APP_NODE: app2
      DEPLOYMENT_ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      DB_URL: mongodb://mongo-master:27017,mongo-replica-1:27017,mongo-replica-2:27017/taskhub?replicaSet=rs0
      DB_USERNAME: ''
      DB_PASSWORD: ''

      REDIS_URL: redis://default:${REDIS_PASSWORD:-redispassword}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}

      EXPRESS_WORKERS: ${EXPRESS_WORKERS:-2}

      OTEL_SERVICE_NAME: taskhub-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://host.docker.internal:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://host.docker.internal:4318/v1/metrics
      OTEL_RESOURCE_ATTRIBUTES: service.name=taskhub-api,service.version=1.0.0,deployment.environment.name=development
    ports:
      - '3001:3000'

volumes:
  mongo-master-data:
  mongo-replica-1-data:
  mongo-replica-2-data:
  redis-data:

networks:
  taskhub-network:
    driver: bridge
