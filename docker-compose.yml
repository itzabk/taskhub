version: '3.8'

services:
  # MongoDB Primary (Master)
  mongo-master:
    image: mongo:7.0-alpine
    container_name: taskhub-mongo-master
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo-master-data:/data/db
    command: >
      mongod
      --replSet rs0
      --bind_ip_all
      --auth
    networks:
      - taskhub-network
    healthcheck:
      test: echo "db.adminCommand('ping')" | mongosh -u root -p rootpassword --authenticationDatabase admin
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 40s

  # MongoDB Replica 1 (Read-Only)
  mongo-replica-1:
    image: mongo:7.0-alpine
    container_name: taskhub-mongo-replica-1
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo-replica-1-data:/data/db
    command: >
      mongod
      --replSet rs0
      --bind_ip_all
      --auth
    networks:
      - taskhub-network
    depends_on:
      mongo-master:
        condition: service_healthy
    healthcheck:
      test: echo "db.adminCommand('ping')" | mongosh -u root -p rootpassword --authenticationDatabase admin
      interval: 5s
      timeout: 2s
      retries: 10

  # MongoDB Replica 2 (Read-Only)
  mongo-replica-2:
    image: mongo:7.0-alpine
    container_name: taskhub-mongo-replica-2
    ports:
      - '27019:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo-replica-2-data:/data/db
    command: >
      mongod
      --replSet rs0
      --bind_ip_all
      --auth
    networks:
      - taskhub-network
    depends_on:
      mongo-master:
        condition: service_healthy
    healthcheck:
      test: echo "db.adminCommand('ping')" | mongosh -u root -p rootpassword --authenticationDatabase admin
      interval: 5s
      timeout: 2s
      retries: 10

  # Initialize MongoDB Replica Set
  mongo-init:
    image: mongo:7.0-alpine
    container_name: taskhub-mongo-init
    networks:
      - taskhub-network
    depends_on:
      mongo-master:
        condition: service_healthy
      mongo-replica-1:
        condition: service_healthy
      mongo-replica-2:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      mongosh --host mongo-master:27017 -u root -p rootpassword --authenticationDatabase admin <<EOF
      var cfg = rs.conf();
      cfg.members = [
        {_id: 0, host: 'mongo-master:27017', priority: 10},
        {_id: 1, host: 'mongo-replica-1:27017', priority: 5},
        {_id: 2, host: 'mongo-replica-2:27017', priority: 5}
      ];
      rs.reconfig(cfg, {force: true});
      EOF
      sleep 5;
      "
    profiles:
      - init

  # Redis
  redis:
    image: redis:7-alpine
    container_name: taskhub-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass redispassword
    networks:
      - taskhub-network
    healthcheck:
      test: redis-cli --raw incr ping
      interval: 5s
      timeout: 2s
      retries: 10

  # MailCatcher
  mailcatcher:
    image: sj26/mailcatcher:latest
    container_name: taskhub-mailcatcher
    ports:
      - '1025:1025'
      - '1080:1080'
    networks:
      - taskhub-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:1080']
      interval: 5s
      timeout: 2s
      retries: 10

  # Node.js Application - Instance 1
  taskhub-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskhub-app-1
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EXPRESS_WORKERS: ${EXPRESS_WORKERS}
    volumes:
      - ./src:/usr/src/app/src
      - ./logs:/usr/src/app/logs
    networks:
      - taskhub-network
    depends_on:
      mongo-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailcatcher:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Node.js Application - Instance 2
  taskhub-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskhub-app-2
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EXPRESS_WORKERS: ${EXPRESS_WORKERS}
    volumes:
      - ./src:/usr/src/app/src
      - ./logs:/usr/src/app/logs
    networks:
      - taskhub-network
    depends_on:
      mongo-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailcatcher:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Node.js Application - Instance 3
  taskhub-app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskhub-app-3
    ports:
      - '3002:3000'
    environment:
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EXPRESS_WORKERS: ${EXPRESS_WORKERS}
    volumes:
      - ./src:/usr/src/app/src
      - ./logs:/usr/src/app/logs
    networks:
      - taskhub-network
    depends_on:
      mongo-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailcatcher:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  mongo-master-data:
  mongo-replica-1-data:
  mongo-replica-2-data:
  redis-data:

networks:
  taskhub-network:
    driver: bridge
